name: CI pipeline

on:
  push:
     branches: [main]
     paths:
       - 'Server/**' 
       - 'Client/**'
       - '.github/workflows/ci.yml'
  pull_request:
     branches: [main]
     paths:
       - 'Server/**'
       - 'Client/**'
  workflow_dispatch:

jobs:
  backend-lint:
    name: Server Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Server/package-lock.json
      
      - name: Install Dependencies
        working-directory: ./Server
        run: npm ci

      - name: Run ESLint
        working-directory: ./Server
        run: npm run lint
 
  backend-build:
    name: Server Checks
    runs-on: ubuntu-latest
    needs: backend-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Server/package-lock.json 
      
      - name: Install Dependencies
        working-directory: ./Server
        run: npm ci
      
      - name: Build Typescript
        working-directory: ./Server
        run: npm run build

      - name: Debug environment
        working-directory: ./Server
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Current directory: $(pwd)"
          echo "Files in current directory:"
          ls -la dist/ || echo "dist/doesnt exist"

      - name: Verify app starts
        working-directory: ./Server
        env:
          PORT: 3000
          NODE_ENV: production
          GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}
        run: |
           node dist/index.js & 
           sleep 5
           curl -f http://localhost:3000/ || exit 1 
           kill %1 
  
  docker:
    name: Build and push Docker Image 
    runs-on: ubuntu-latest
    needs: backend-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' #only run on push to main   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}
      
      - name: Extract metadata-Backend
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{secrets.DOCKERHUB_USERNAME}}/smarttext-server
          tags: |
              type=raw,value=latest
              type=sha,prefix=,format=short
        
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker Backend image
        uses: docker/build-push-action@v4
        with:
          context: ./Server
          file: ./Server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # use Github Actions cache
          cache-to: type=gha,mode=max #save to Github Actions cache

      

